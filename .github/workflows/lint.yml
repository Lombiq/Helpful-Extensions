name: Lint Assets

# Runs for PRs opened for any branch, and pushes to the main branch.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Assets
    uses: Lombiq/NodeJs-Extensions/.github/workflows/lint.yml@dev
    with:
      scripts: Lombiq.HelpfulExtensions
      styles-css: Lombiq.HelpfulExtensions
